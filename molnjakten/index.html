const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:u8(D.s),iterations:300000},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  let gz; try{ gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.i)},key,u8(D.c)); }catch(e){ return null; }
  return await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
const K="pv-pw:"+location.pathname;
async function open_(pw,quiet){
  const html=await unlock(pw);
  if(html===null){ if(!quiet) err.textContent="Fel lösenord, försök igen."; return false; }
  try{ sessionStorage.setItem(K,pw); }catch(e){}
  document.open(); document.write(html); document.close(); return true;
}
f.onsubmit=async e=>{ e.preventDefault(); go.disabled=true; err.textContent="";
  try{ if(!await open_(pw.value)){ go.disabled=false; pw.select(); } }catch(x){ err.textContent="Webbläsaren kunde inte öppna prototypen."; go.disabled=false; } };
(async()=>{ let s=null; try{ s=sessionStorage.getItem(K); }catch(e){} if(s) try{ await open_(s,true); }catch(e){} })();
