<style>
/* Layout: bara en sak på sidan, knappen man drar till bokmärkesfältet, centrerad.
   Stil: minimal, raka hörn (Polestar-inspirerat), Vings färgpalett från Design Token. */
:root{
  --bg:#faf6f1; --fg:#202020; --muted:#5e5e5e; --title:#8f8f8f; --btn:#202020; --btn-ink:#ffffff;
  --font:"Source Sans Pro","Source Sans 3",-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#202020;--fg:#faf6f1;--muted:#b3b3b3;--btn:#ff5e00;--btn-ink:#ffffff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#202020;--fg:#faf6f1;--muted:#b3b3b3;--btn:#ff5e00;--btn-ink:#ffffff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.5 var(--font);display:grid;place-items:center;text-align:center;padding:48px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
main{display:flex;flex-direction:column;align-items:center;gap:36px;max-width:40rem}
.kicker,h1{font-weight:400;font-size:2.25rem;letter-spacing:-.02em;line-height:1.1;margin:0}
.kicker{color:var(--title)}
.bm{display:inline-flex;align-items:center;gap:14px;padding:26px 44px;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:1.5rem;letter-spacing:.01em;text-decoration:none;cursor:grab;user-select:none}
.bm:active{cursor:grabbing}
.bm svg{width:1.2em;height:1.2em;flex:none}
.hint{color:var(--muted);margin:0}
kbd{font:inherit;font-weight:600;color:var(--fg)}
@media (max-width:560px){.kicker,h1{font-size:1.75rem}.bm{font-size:1.25rem;padding:20px 28px}}
</style>
