function idb(){return new Promise(function(res,rej){var r=indexedDB.open("pp-site",1);r.onupgradeneeded=function(){r.result.createObjectStore("k")};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function idbGet(k){return idb().then(function(db){return new Promise(function(res,rej){var q=db.transaction("k").objectStore("k").get(k);q.onsuccess=function(){res(q.result)};q.onerror=function(){rej(q.error)}})})}
function idbPut(k,v){return idb().then(function(db){return new Promise(function(res,rej){var t=db.transaction("k","readwrite");t.objectStore("k").put(v,k);t.oncomplete=function(){res()};t.onerror=function(){rej(t.error)}})})}
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const SCOPE=new URL(".",location.href).href;
const NEXT=(new URLSearchParams(location.search).get("next")||"").replace(/^([a-z][a-z0-9+.-]*:|\/)+/i,"");
async function keyFrom(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:u8(D.s),iterations:300000},base,512));
  return crypto.subtle.importKey("raw",bits.slice(0,32),"AES-GCM",false,["decrypt"]);
}
async function manifest(key){ try{ return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.i)},key,u8(D.c)))); }catch(e){ return null; } }
async function enter(key,m){
  await idbPut(SCOPE,{key:key,m:m,v:D.v});
  await navigator.serviceWorker.register("sw.js"); await navigator.serviceWorker.ready;
  location.replace(SCOPE+"app/"+(NEXT||m.start));
}
f.onsubmit=async e=>{ e.preventDefault(); go.disabled=true; err.textContent="";
  try{ const key=await keyFrom(pw.value), m=await manifest(key);
    if(!m){ err.textContent="Fel lösenord, försök igen."; go.disabled=false; pw.select(); return; }
    await enter(key,m);
  }catch(x){ err.textContent="Webbläsaren kunde inte öppna prototypen."; go.disabled=false; } };
(async()=>{
  if(!("serviceWorker" in navigator) || !window.indexedDB){ f.hidden=false; err.textContent="Den här webbläsaren kan inte öppna prototypen. Prova Safari, Chrome eller Edge (inte privat läge i Firefox)."; go.disabled=true; return; }
  // Upplåst förut i den här webbläsaren: samma lösenord öppnar även en ny version direkt
  try{ const r=await idbGet(SCOPE); if(r&&r.key){ const m=await manifest(r.key); if(m) return await enter(r.key,m); } }catch(e){}
  f.hidden=false; pw.focus();
})();
